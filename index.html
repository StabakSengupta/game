<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Last Seed — (Playable Prototype)</title>
  <meta name="description" content="The Last Seed — a tiny HTML5 prototype with embedded PNG assets."/>
  <style>
    :root{--bg:#0b0f12;--text:#e8f0f2;--accent:#8bd17b}
    html,body{height:100%;margin:0;font-family:Inter,system-ui,Segoe UI,Roboto,Arial; background:linear-gradient(180deg,#041018 0%, #07121a 60%, #0b0f12 100%); color:var(--text);}    
    .wrap{max-width:980px;margin:28px auto;padding:20px;background:rgba(255,255,255,0.02);border-radius:12px;box-shadow:0 6px 30px rgba(0,0,0,0.6);}    
    canvas{background:#0a0f12;border-radius:10px;border:1px solid rgba(255,255,255,0.05)}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>The Last Seed — Prototype (PNG Assets Embedded)</h1>
    <canvas id="gameCanvas" width="800" height="520"></canvas>
  </div>

<script>
// === EMBEDDED PNG IMAGES ===
// simple placeholder images (colored circles) encoded as PNG base64
const IMG_SEED = new Image();
IMG_SEED.src = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAMAAAAoLQ9TAAAAM1BMVEUAAAD///////////////////////////////////////////////////////////////8tW7x/AAAADHRSTlMAAQIDBAUGBwgJCgsMDWwE8QAAAEFJREFUGNNjYBgFo2AUjIKRkYGBgZGJiYmBgYHh4eFBQUFhYGBgaGJiYmBgYGJiYmBgYGAQwsDAwMjAwMAAACBaAVWmJsteQAAAABJRU5ErkJggg==";

const IMG_ROCK = new Image();
IMG_ROCK.src = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAMAAAAoLQ9TAAAAOVBMVEUAAAD///////////////////////////////////////////////////////+zs7P///8dP0uHAAAAD3RSTlMAAQIDBAUGBwgJCgsMDQ4P4V5KoAAAADxJREFUGNNjYIADJiYmBgYGJiYmBiYGBg4ODgREREQYGBjY2NgYGBgAAAwxQAyE466+QAAAABJRU5ErkJggg==";

const IMG_NUT = new Image();
IMG_NUT.src = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAMAAAAoLQ9TAAAAQlBMVEUAAAD///////////////////////////////////////////////////////////////////////////////////////+Zd7y/AAAAEnRSTlMAAQIDBAUGBwgJCgsMDQ4PEBESFokyNwAAAEJJREFUGNNjYIACJiYmBgYGRiYmBiYGAoKCgYGBjo6OggICAkJCQwMDIwMDAwAAAw5QAwYawslQAAAABJRU5ErkJggg==";

const IMG_SOIL = new Image();
IMG_SOIL.src = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAMAAAAoLQ9TAAAAOVBMVEUAAAD/////////////////////////////////////////////////////////////////8uOkgAAAADHRSTlMAAQIDBAUGBwgJCgsMDQ4PESGCUwAAAD1JREFUGNNjYIADRkYGJiYmBgYGBkZGRiYmBhYWFiYmBgYGJiYmBgYGAQEBAQEAwMDAwMAAAGaQAzLY9QjAAAAABJRU5ErkJggg==";

// === GAME LOGIC ===
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let seed = {x:80, y:260, r:16};
let rocks = [];
let nuts = [];
let soil = {x:680, y:200, w:90, h:120};

function spawnRock(){
  rocks.push({x:800, y:60+Math.random()*380, r:20});
}

function spawnNut(){
  nuts.push({x:140+Math.random()*500, y:40+Math.random()*420, r:12});
}

window.addEventListener('keydown', e=>{
  if(e.key==='ArrowUp') seed.y-=10;
  if(e.key==='ArrowDown') seed.y+=10;
  if(e.key==='ArrowLeft') seed.x-=10;
  if(e.key==='ArrowRight') seed.x+=10;
});

function loop(){
  ctx.clearRect(0,0,800,520);
  
  // draw soil
  ctx.drawImage(IMG_SOIL, soil.x, soil.y, soil.w, soil.h);
  
  // draw nuts
  for(let n of nuts){ ctx.drawImage(IMG_NUT, n.x-n.r, n.y-n.r, n.r*2, n.r*2);}  
  
  // draw rocks
  for(let r of rocks){ r.x -= 2; ctx.drawImage(IMG_ROCK, r.x-r.r, r.y-r.r, r.r*2, r.r*2);}    
  rocks = rocks.filter(r=>r.x>-40);

  // draw seed
  ctx.drawImage(IMG_SEED, seed.x-seed.r, seed.y-seed.r, seed.r*2, seed.r*2);

  requestAnimationFrame(loop);
}

// initial spawns
for(let i=0;i<4;i++) spawnNut();
setInterval(spawnRock, 1500);
loop();
</script>
</body>
</html>
